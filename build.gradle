buildscript {
  ext.kotlinVersion = '1.8.22'

  repositories {
    mavenCentral()
    gradlePluginPortal()
    maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
    google()
  }
  dependencies {
    classpath 'com.android.tools.build:gradle:8.1.4'
  }
}

allprojects {
  apply plugin: "eclipse"
  apply plugin: "idea"

  version = '1.0'
  ext {
    appName = "ludo"
    gdxVersion = '1.13.5'
    box2DLightsVersion = '1.5'
  }

  repositories {
    mavenCentral()
    maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
    maven { url "https://oss.sonatype.org/content/repositories/releases/" }
    google()
  }

  configurations.all {
    resolutionStrategy {
      force "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
      force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlinVersion"
      force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlinVersion"
    }
  }
}

project(":core") {
  apply plugin: "java-library"

  dependencies {
    api "com.badlogicgames.gdx:gdx:$gdxVersion"
    api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"

    implementation "com.google.code.gson:gson:2.10.1"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.mockito:mockito-core:5.3.1"
  }
}

// Client module for desktop game
project(":client") {
  apply plugin: "java-library"

  // Ensure client module can access the core classes
  evaluationDependsOn(":core")
}

// LWJGL3 module
project(":lwjgl3") {
  apply plugin: 'application'

  ext.mainClassName = "ludo.lwjgl3.Lwjgl3Launcher"

  dependencies {
    implementation project(":core")
    implementation project(":client")
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
  }

  jar {
    archiveBaseName = 'ludo-client'
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)

    manifest {
      attributes 'Main-Class': project.mainClassName
    }

    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }

    from(rootProject.file('assets')) {
      into '.'
    }
  }

  tasks.withType(JavaExec) {
    workingDir = rootProject.file("assets")

    if (System.getProperty("os.name").toLowerCase().contains("mac")) {
      jvmArgs += "-XstartOnFirstThread"
    }
  }
}

//// Android module
//project(":android") {
//  apply plugin: "com.android.application"
//
//  // Ensure Android module waits for core and client to be evaluated
//  evaluationDependsOn(":core")
//  evaluationDependsOn(":client")
//}

// Server module
project(":server") {
  apply plugin: "java-library"
  apply plugin: "application"

  dependencies {
    implementation project(":core")
    implementation "org.java-websocket:Java-WebSocket:1.5.3"
    implementation "com.google.code.gson:gson:2.10.1"
    implementation "org.slf4j:slf4j-api:2.0.7"
    implementation "ch.qos.logback:logback-classic:1.4.7"
  }

    jar {
      archiveBaseName = 'ludo-server'
      duplicatesStrategy(DuplicatesStrategy.EXCLUDE)

      manifest {
        attributes 'Main-Class': 'ludo.server.ServerLauncher'
      }

      from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    }
}


task createRelease(type: Copy) {
  group = "Distribution"
  description = "Assembles the client and server JARs into a 'release' folder."

  dependsOn project(':lwjgl3').jar
  dependsOn project(':server').jar

  delete "release"

  into "release"

  from project(':lwjgl3').jar
  from project(':server').jar
}
