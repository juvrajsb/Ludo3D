android {
  sourceSets {
    main {
      manifest.srcFile 'src/main/AndroidManifest.xml'
      java.srcDirs = ['src/main/java']
      aidl.srcDirs = ['src/main/java']
      renderscript.srcDirs = ['src/main/java']
      res.srcDirs = ['src/main/res']
      assets.srcDirs = ['../assets']
      jniLibs.srcDirs = ['libs']
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
  defaultConfig {
    compileSdk 34
    applicationId "ludo.android"
    minSdkVersion 21
    targetSdkVersion 34
    versionCode 1
    versionName "1.0"
    multiDexEnabled true
  }
  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
    }
  }

  packagingOptions {
    // =========== COMPREHENSIVE SOLUTION ===========
    // Instead of excluding specific files, let's use pickFirst for all LibGDX resources
    // This ensures that only one version of each file is included (the first one found)
    pickFirst 'com/badlogic/gdx/**'
    pickFirst 'com/**/*.glsl'
    pickFirst 'com/**/*.rl'
    pickFirst 'com/**/*.fnt'
    pickFirst 'com/**/*.png'
    pickFirst 'com/**/*.json'

    // For specific META-INF files, we should still exclude them
    exclude 'META-INF/LICENSE.txt'
    exclude 'META-INF/NOTICE.txt'
    exclude 'META-INF/DEPENDENCIES'
    exclude 'META-INF/MANIFEST.MF'
    exclude 'META-INF/lwjgl.*'
    exclude 'META-INF/versions/**'
    exclude 'META-INF/native-image/**'
    exclude 'META-INF/INDEX.LIST'

    // Exclude all LWJGL native libraries
    exclude '**/*.dll'
    exclude '**/*.so'
    exclude '**/*.jnilib'
    exclude '**/*.dylib'
    exclude 'windows/**'
    exclude 'linux/**'
    exclude 'macos/**'
    exclude 'META-INF/macos/**'
    exclude 'META-INF/windows/**'
    exclude 'META-INF/linux/**'
  }

  namespace "ludo.android"
}

dependencies {
  // Use compileOnly for core since we don't want its transitive dependencies
  // included twice (they're already in client)
  compileOnly project(":core")

  // Use implementation for client
  implementation project(":client")

  // Android dependencies
  implementation 'androidx.appcompat:appcompat:1.7.0'
  implementation 'androidx.multidex:multidex:2.0.1'

  // LibGDX dependencies
  api "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
  api "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
  api "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
  api "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
  api "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
  api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
  api "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-armeabi-v7a"
  api "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-arm64-v8a"
  api "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-x86"
  api "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-x86_64"
}
