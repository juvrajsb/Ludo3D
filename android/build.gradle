android {
  sourceSets {
    main {
      manifest.srcFile 'AndroidManifest.xml'
      java.srcDirs = ['src/main/java']
      aidl.srcDirs = ['src/main/java']
      renderscript.srcDirs = ['src/main/java']
      res.srcDirs = ['src/main/res']
      assets.srcDirs = ['../assets']
      jniLibs.srcDirs = ['src/main/jniLibs']
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  defaultConfig {
    compileSdk 34
    applicationId "ludo.android"
    minSdkVersion 21
    targetSdkVersion 34
    versionCode 1
    versionName "1.0"
    multiDexEnabled true
  }

  packagingOptions {
    // Handle duplicate files
    pickFirst "META-INF/DEPENDENCIES"
    pickFirst 'META-INF/INDEX.LIST'

    // Exclude unnecessary files for Android
    exclude 'META-INF/robovm/ios/robovm.xml'
    exclude 'META-INF/MANIFEST.MF'
    exclude 'META-INF/macos/**'
    exclude 'META-INF/windows/**'
    exclude 'META-INF/linux/**'
  }

  namespace "ludo.android"
}

// Define configurations for native libraries
configurations {
  natives
}

dependencies {
  // Core project dependencies
  implementation project(":core")
  implementation project(":client")

  // Android dependencies
  implementation 'androidx.appcompat:appcompat:1.7.0'
  implementation 'androidx.multidex:multidex:2.0.1'

  // LibGDX dependencies
  api "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"

  // Native libraries for direct extraction
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
  natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-armeabi-v7a"
  natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-arm64-v8a"
  natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-x86"
  natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-x86_64"
}

// Improved task to extract native libraries with ABI directory structure preserved
task extractNatives() {
  description = "Extracts native libraries with ABI structure preserved"

  doFirst {
    // Clean old libraries completely
    delete fileTree(dir: 'src/main/jniLibs')

    // Make sure base directory exists
    file("src/main/jniLibs").mkdirs()
  }

  doLast {
    // Process each native library JAR with proper categorization
    configurations.natives.files.each { jar ->
      // Extract JAR name to determine ABI
      def jarName = jar.name
      println "Processing JAR: $jarName"

      // Figure out which ABI this JAR is for
      def abiDir = ""
      if (jarName.contains("natives-armeabi-v7a")) {
        abiDir = "armeabi-v7a"
      } else if (jarName.contains("natives-arm64-v8a")) {
        abiDir = "arm64-v8a"
      } else if (jarName.contains("natives-x86_64")) {
        abiDir = "x86_64"
      } else if (jarName.contains("natives-x86")) {
        abiDir = "x86"
      } else {
        println "Unknown ABI in JAR: $jarName, skipping"
        return
      }

      // Make sure the ABI directory exists
      file("src/main/jniLibs/$abiDir").mkdirs()

      // Extract SO files specifically to the correct ABI directory
      copy {
        from zipTree(jar)
        into "src/main/jniLibs/$abiDir"
        include "**/*.so"
        // Ignore directory structure within JAR
        eachFile { file ->
          // Extract just the filename, not the path
          file.setPath(file.getName())
          println "Extracting to $abiDir: ${file.path}"
        }
        includeEmptyDirs = false
      }
    }

    // Verify extraction structure - debug output
    println "EXTRACTED LIBRARY STRUCTURE:"
    fileTree(dir: 'src/main/jniLibs').each { file ->
      println "File: $file"
    }
  }
}

// Make the build process depend on our native extraction
preBuild.dependsOn(extractNatives)
