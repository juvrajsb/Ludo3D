buildscript{
  repositories{
    mavenLocal()
    mavenCentral()
    google()
    maven{ url "https://oss.sonatype.org/content/repositories/snapshots/" }
  }

  dependencies{
    classpath 'com.android.tools.build:gradle:8.2.2'
  }
}

apply plugin: "com.android.application"

//configurations{ natives }

repositories{
  mavenCentral()
  maven{ url "https://maven.google.com" }
}

android {
  namespace "ludo.android"
  compileSdk 34

  sourceSets {
    main {
      manifest.srcFile 'AndroidManifest.xml'
      java.srcDirs = ['src/main/java']
      aidl.srcDirs = ['src/main/java']
      renderscript.srcDirs = ['src/main/java']
      res.srcDirs = ['src/main/res']
      assets.srcDirs = ['../assets']
      jniLibs.srcDirs = ['libs', 'src/main/jniLibs']
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  defaultConfig{
    applicationId "ludo.android"
    minSdkVersion 21
    targetSdkVersion 34

    multiDexEnabled true
  }

  flavorDimensions = ["google"]


  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
    }
  }

  packagingOptions {
    // =========== COMPREHENSIVE SOLUTION ===========
    // Instead of excluding specific files, let's use pickFirst for all LibGDX resources
    // This ensures that only one version of each file is included (the first one found)
//    pickFirst 'com/badlogic/gdx/**'
//    pickFirst 'com/**/*.glsl'
//    pickFirst 'com/**/*.rl'
//    pickFirst 'com/**/*.fnt'
//    pickFirst 'com/**/*.png'
//    pickFirst 'com/**/*.json'

    // For specific META-INF files, we should still exclude them
//    exclude 'META-INF/LICENSE.txt'
//    exclude 'META-INF/NOTICE.txt'
    pickFirst "META-INF/DEPENDENCIES"
//    exclude 'META-INF/MANIFEST.MF'
//    exclude 'META-INF/lwjgl.*'
//    exclude 'META-INF/versions/**'
//    exclude 'META-INF/native-image/**'
    pickFirst 'META-INF/INDEX.LIST'

    // Exclude all LWJGL native libraries
//    exclude '**/*.dll'
//    exclude '**/*.so'
//    exclude '**/*.jnilib'
//    exclude '**/*.dylib'
//    exclude 'windows/**'
//    exclude 'linux/**'
//    exclude 'macos/**'
    exclude 'META-INF/macos/**'
    exclude 'META-INF/windows/**'
    exclude 'META-INF/linux/**'
  }
}

configurations {
  natives
}

dependencies {
  // Core project dependencies
  implementation project(":core")
  implementation project(":client")

  // Android dependencies
  implementation 'androidx.appcompat:appcompat:1.7.0'
  implementation 'androidx.multidex:multidex:2.0.1'

  // LibGDX dependencies
  implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
  implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
  implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
  implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
  implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
  implementation "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
  implementation "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-armeabi-v7a"
  implementation "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-arm64-v8a"
  implementation "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-x86"
  implementation "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-x86_64"

  // Natives configuration for the copyAndroidNatives task
//  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
//  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
//  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
//  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
//  natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-armeabi-v7a"
//  natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-arm64-v8a"
//  natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-x86"
//  natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-x86_64"
}

